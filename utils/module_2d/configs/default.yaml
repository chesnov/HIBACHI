execute_raw_segmentation_fluorescence_2d:
    name: Execute Raw Segmentation (2D)
    parameters:
      use_absolute_thresholds:
        label: 'Threshold Mode: Use Absolute Intensity (Disable Percentiles)'
        type: bool
        value: true
      scale_profiles_percentile:
        label: Tubularity Profiles (Percentiles + Per-Scale Filters)
        type: scale_table
        value:
        - scale: 1.0
          low: 95.0
          high: 99.0
          smooth_sigma: 0.1
          connect_max_gap_physical: 0.0
        - scale: 1.5
          low: 98.0
          high: 100.0
          smooth_sigma: 0.1
          connect_max_gap_physical: 0.0
        - scale: 3.0
          low: 98.0
          high: 100.0
          smooth_sigma: 0.1
          connect_max_gap_physical: 0.0
      scale_profiles_absolute:
        label: Tubularity Profiles (Absolute [0.0 - 1.0] + Per-Scale Filters)
        type: scale_table_absolute
        value:
        - scale: 0.0
          low: 0.2
          high: 1.0
          smooth_sigma: 0.1
          connect_max_gap_physical: 0.0
        - scale: 1.5
          low: 0.03
          high: 1.0
          smooth_sigma: 0.1
          connect_max_gap_physical: 0.0
      min_size:
        label: Minimum Size (Pixels, Raw Seg - GLOBAL)
        type: int
        value: 200
        min: 10
        max: 50000
        step: 1
      trace_max_gap:
        label: Trace Gap (µm)
        hint: Orientation-following gap tracing. Reconnects a structure broken by
          a dim stretch by walking the local intensity ridge outward from each
          fragment tip (branch-by-branch, so arborized cells are handled) and
          bridging to whatever it reaches within this distance. 0 = off.
        type: float
        value: 0.0
        min: 0.0
        max: 50.0
        step: 0.5
