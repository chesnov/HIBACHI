# =============================================================================
# HIBACHI runtime environment  (install/environment.yml)
# -----------------------------------------------------------------------------
# This is the project's VALIDATED dependency set. Only two things were changed
# from the original environment.yaml:
#   1. Added `git` (conda-forge) -- required by the installer's clone step and
#      the self-updater, so it works on machines with no system git.
#   2. Dropped the Anaconda `defaults` channel (everything comes from pip or
#      conda-forge anyway) to avoid Anaconda's commercial Terms of Service.
#
# The installer reads this file, and the launcher rebuilds the environment
# automatically whenever this file changes upstream -- so this path
# (install/environment.yml) is the single source of truth for dependencies.
# =============================================================================
name: hibachi

channels:
  - conda-forge

dependencies:
  - python=3.11
  - git                 # needed for git clone + self-update on clean machines
  - pip
  - pip:
      - google-crc32c>=1.7.1
      - napari[all]~=0.5.6
      - napari-animation~=0.0.9   # 3D rotation / turntable movies
      - imageio-ffmpeg>=0.5.1     # bundled ffmpeg binary (Win/Linux/macOS incl. Apple Silicon) for MP4 export
      - napari-plugin-manager~=0.1.4
      - nbformat~=5.10.4
      - numba~=0.61.0
      - PartSegCore_compiled_backend~=0.15.9
      - pipdeptree~=2.25.1
      - plotly~=6.0.0
      - pooch~=1.8.2
      - pyconify~=0.2.1
      - PyQt5~=5.15.11
      - scikit-learn~=1.6.1
      # Whole-slide formats (Olympus .vsi, Aperio, Hamamatsu, Leica and others).
      # pip rather than conda: wheels exist for macOS arm64 + x86_64, Linux and
      # Windows, and unlike the Bio-Formats route it needs no JVM.
      - slideio>=2.7.4
      # Leica .lif. slideio has no LIF driver, so this is a second reader rather
      # than a redundant one. Pure Python, no JVM, same constraint as above.
      - readlif>=0.6.5
      - seaborn~=0.13.2
      - tifffile>=2023.1.1
      # tifffile decodes only a few codecs itself and delegates the rest --
      # JPEG, JPEG2000, WebP, LZMA, Zstd -- to imagecodecs, raising
      # "<COMPRESSION.JPEG2000: 34712> requires the 'imagecodecs' package" when
      # it is absent. Whole-slide exports and many camera/vendor TIFFs are
      # JPEG2000, so those files simply could not be opened. slideio handles the
      # proprietary slide formats, but a plain .tif goes through tifffile, which
      # is why having slideio did not already cover this.
      #
      # Floor rather than a pin, matching the readers above. 2026.3.6 is the
      # version this was verified with (python 3.11, Linux, numpy 2.2.6,
      # tifffile 2026.3.3, imagecodecs.JPEG2K.available True); older releases
      # very likely work but were not tested, so the floor claims only what was.
      # It requires just numpy>=2.0, so it constrains nothing else here.
      #
      # ~27 MB binary wheel (cp311-abi3), with wheels for Windows, Linux and
      # both macOS architectures; no system libraries or JVM needed.
      - imagecodecs>=2026.3.6
      - zarr~=3.0.2
      - dask-image~=2024.5.3
      - simpleitk~=2.5.2
      - skan~=0.12.2
      - aicspylibczi~=3.3.1
      - fcswrite~=0.6.4