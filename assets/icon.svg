<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232734"/>
      <stop offset="1" stop-color="#3a2b28"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1024" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ff7a2f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#ember)"/>

  <!-- segmented "cells": distinct label colors, dark boundaries like a label map.
       Laid out as the letter H (two legs + crossbar through a hub), with varied
       radii and slight jitter. Sizes are capped so no two cells overlap. -->
  <g stroke="#232734" stroke-width="14">
    <circle cx="340" cy="279" r="74" fill="#33c2b3"/>
    <circle cx="345" cy="499" r="59" fill="#e5568a"/>
    <circle cx="324" cy="728" r="87" fill="#79c74f"/>
    <circle cx="695" cy="273" r="101" fill="#f2b134"/>
    <circle cx="704" cy="509" r="60" fill="#4f9be5"/>
    <circle cx="674" cy="727" r="78" fill="#33c2b3"/>
    <circle cx="523" cy="522" r="53" fill="#f2b134"/>
  </g>

  <!-- neighbor-connection overlay (on top): traces the H -->
  <g stroke="#ff4d4d" stroke-width="12" stroke-linecap="round">
    <line x1="340" y1="279" x2="345" y2="499"/>
    <line x1="345" y1="499" x2="324" y2="728"/>
    <line x1="695" y1="273" x2="704" y2="509"/>
    <line x1="704" y1="509" x2="674" y2="727"/>
    <line x1="345" y1="499" x2="523" y2="522"/>
    <line x1="523" y1="522" x2="704" y2="509"/>
  </g>
  <g fill="#ffffff" stroke="#c62f2f" stroke-width="6">
    <circle cx="340" cy="279" r="20"/>
    <circle cx="345" cy="499" r="20"/>
    <circle cx="324" cy="728" r="20"/>
    <circle cx="695" cy="273" r="20"/>
    <circle cx="704" cy="509" r="20"/>
    <circle cx="674" cy="727" r="20"/>
    <circle cx="523" cy="522" r="20"/>
  </g>
</svg>
