<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232734"/>
      <stop offset="1" stop-color="#3a2b28"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1024" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ff7a2f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#ember)"/>

  <!-- segmented "cells": distinct label colors, dark boundaries like a label map -->
  <g stroke="#232734" stroke-width="14">
    <circle cx="405" cy="430" r="150" fill="#33c2b3"/>
    <circle cx="620" cy="398" r="126" fill="#f2b134"/>
    <circle cx="470" cy="628" r="138" fill="#e5568a"/>
    <circle cx="655" cy="612" r="116" fill="#79c74f"/>
    <circle cx="533" cy="505" r="82"  fill="#4f9be5"/>
  </g>

  <!-- neighbor-connection overlay (on top, like Figure 1) -->
  <g stroke="#ff4d4d" stroke-width="12" stroke-linecap="round">
    <line x1="405" y1="430" x2="620" y2="398"/>
    <line x1="405" y1="430" x2="533" y2="505"/>
    <line x1="620" y1="398" x2="533" y2="505"/>
    <line x1="470" y1="628" x2="533" y2="505"/>
    <line x1="655" y1="612" x2="533" y2="505"/>
    <line x1="470" y1="628" x2="655" y2="612"/>
  </g>
  <g fill="#ffffff" stroke="#c62f2f" stroke-width="6">
    <circle cx="405" cy="430" r="20"/>
    <circle cx="620" cy="398" r="20"/>
    <circle cx="470" cy="628" r="20"/>
    <circle cx="655" cy="612" r="20"/>
    <circle cx="533" cy="505" r="20"/>
  </g>
</svg>
