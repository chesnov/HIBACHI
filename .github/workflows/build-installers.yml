name: Build installers

# Builds the native installers and attaches them to the GitHub Release:
#   - HIBACHI-Setup.exe  (Windows, via Inno Setup)
#   - HIBACHI.dmg        (macOS, via hdiutil)
#
# Triggers on a pushed tag like v1.2.3, or manually via the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to upload assets to the Release

jobs:
  # ---------------------------------------------------------------- Windows
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "packaging\windows\hibachi.iss"

      - name: Locate output
        id: out
        shell: bash
        run: echo "path=$(find . -name 'HIBACHI-Setup.exe' | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HIBACHI-Setup-exe
          path: ${{ steps.out.outputs.path }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.out.outputs.path }}

  # ------------------------------------------------------------------ macOS
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          packaging/macos/build_dmg.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: HIBACHI-dmg
          path: HIBACHI.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HIBACHI.dmg
