name: Build installers

# Builds the native installers and attaches them to the GitHub Release:
#   - HIBACHI-Setup.exe  (Windows, via Inno Setup)
#   - HIBACHI.dmg        (macOS, via hdiutil)
#
# The two builds run in parallel and only UPLOAD ARTIFACTS. A single, separate
# `release` job then publishes both to the Release. This avoids the race that
# occurs when multiple jobs each try to create/finalize the same tag's release.
#
# Triggers on a pushed tag like v1.2.3, or manually via the Actions tab
# (manual runs build + upload artifacts but do not publish a Release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed for the release job to create/upload the release

jobs:
  # ---------------------------------------------------------------- Windows
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "packaging\windows\hibachi.iss"

      - name: Locate output
        id: out
        shell: bash
        run: echo "path=$(find . -name 'HIBACHI-Setup.exe' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: ${{ steps.out.outputs.path }}
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          packaging/macos/build_dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: HIBACHI.dmg
          if-no-files-found: error

  # ---------------------------------------------- Publish (single release job)
  release:
    needs: [windows-exe, macos-dmg]
    runs-on: ubuntu-latest
    # Only publish for real tag pushes; manual runs just produce artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: dist          # -> dist/installer-windows/..., dist/installer-macos/...

      - name: Publish release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          # Flatten the per-artifact subdirs into a plain file list.
          mapfile -t files < <(find dist -type f | sort)
          echo "Assets to publish:"; printf '  %s\n' "${files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No installer files found under dist/"; exit 1
          fi

          echo "Existing releases:"; gh release list --limit 20 || true

          # view-then-create-or-upload: never throws on a non-404, unlike a
          # blind fetch-and-fail. If the release exists we replace its assets;
          # otherwise we create it fresh with auto-generated notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists -> uploading assets (--clobber)."
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "Release $TAG not found -> creating it."
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes
          fi