name: Build installers

# Builds the native installers and attaches them to the GitHub Release:
#   - HIBACHI-Setup.exe  (Windows, via Inno Setup)
#   - HIBACHI.dmg        (macOS, via hdiutil)
#
# The two builds run in parallel and only UPLOAD ARTIFACTS. A single, separate
# `release` job then publishes both to the Release. This avoids the race that
# occurs when multiple jobs each try to create/finalize the same tag's release.
#
# Triggers on a pushed tag like v1.2.3, or manually via the Actions tab
# (manual runs build + upload artifacts but do not publish a Release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed for the release job to upload assets

jobs:
  # ---------------------------------------------------------------- Windows
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "packaging\windows\hibachi.iss"

      - name: Locate output
        id: out
        shell: bash
        run: echo "path=$(find . -name 'HIBACHI-Setup.exe' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: ${{ steps.out.outputs.path }}
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          packaging/macos/build_dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: HIBACHI.dmg
          if-no-files-found: error

  # ---------------------------------------------- Publish (single release job)
  release:
    needs: [windows-exe, macos-dmg]
    runs-on: ubuntu-latest
    # Only publish for real tag pushes; manual runs just produce artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: dist          # -> dist/installer-windows/..., dist/installer-macos/...

      - name: Publish release with both installers
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true